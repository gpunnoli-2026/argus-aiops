# Service and training code as ConfigMaps, plus the nightly retrain CronJob —
# what deploy.sh builds with `kubectl create configmap --from-file`. Goes away
# when CI builds images (the retrain CronJob then moves into the platform chart).
{{- range $name, $path := dict "argus-service-code" "services" "argus-training" "ml/training" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.revision }}
    path: {{ $path }}
  {{- include "argus.syncPolicy" list | nindent 2 }}
{{- end }}
