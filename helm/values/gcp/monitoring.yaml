# GKE-specific kube-prometheus-stack settings.
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo

# Dataplane V2 replaces kube-proxy with eBPF, so there is nothing to scrape.
# Left enabled, KubeProxyDown fires forever and feeds the correlator noise —
# exactly the kind of alert this platform exists to suppress.
kubeProxy:
  enabled: false

# Same trap for DNS: GKE runs kube-dns, not CoreDNS, and nothing listens on
# the CoreDNS metrics port 9153, so TargetDown fires forever (found in the
# parity run).
coreDns:
  enabled: false
