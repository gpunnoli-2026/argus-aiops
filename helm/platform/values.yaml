# Argus platform values — cloud-neutral defaults.
#
# Layering (scripts/deploy.sh applies them in this order):
#   1. this file                      — defaults that work anywhere
#   2. helm/values/<cloud>/platform.yaml — static facts about the cloud
#      (StorageClass name, which object-store SDK MLflow needs)
#   3. terraform output -json helm_values — per-deployment facts
#      (bucket URI, pod identity wiring); absent on kind
#
# With no overlay at all (plain `helm install`), MLflow keeps its artifacts on
# its own PVC and nothing cloud-specific is rendered.

artifactUri: "" # e.g. s3://argus-artifacts-<acct>/mlartifacts, gs://argus-artifacts-<project>/mlartifacts

prometheusUrl: http://monitoring-kube-prometheus-prometheus.monitoring:9090

# Argus's own images, built by .github/workflows/images.yaml and tagged with
# the git commit they were built from. The deployer sets the tag: Argo CD
# passes the commit it is syncing, deploy.sh passes HEAD. There is no default —
# an unset tag fails the render rather than deploying whatever is newest.
image:
  registry: ghcr.io/gpunnoli-2026
  tag: ""

mlflow:
  image: ghcr.io/mlflow/mlflow:v2.20.2
  storageSize: 5Gi
  storageClassName: "" # empty = cluster default (gp2 on EKS, standard-rwo on GKE)
  # Object-store SDK installed at startup: boto3 (S3) / google-cloud-storage (GCS).
  extraPipPackages: ""
  # Cloud SDK configuration, e.g. AWS_REGION. GCP needs none — the metadata
  # server supplies credentials and location.
  extraEnv: []
  # Pod identity: IRSA needs an annotation, GCP Workload Identity does not.
  serviceAccountAnnotations: {}

anomalyDetector:
  enabled: true
  scoreIntervalSeconds: 30
  modelRefreshSeconds: 300
  modelUri: models:/argus-anomaly@production

capacityForecaster:
  enabled: true
  threshold: "0.8"
  horizonHours: "12"
  # Filesystem the disk forecast tracks. "/" is the writable root on EKS nodes
  # and kind; on GKE's COS nodes "/" is a small read-only image partition, so
  # the GCP overlay points this at the stateful partition instead.
  diskMountpoint: "/"

alertCorrelator:
  enabled: true
  windowSeconds: "300"

retraining:
  enabled: true
  schedule: "0 2 * * *" # nightly, UTC
  trainHours: "6"
