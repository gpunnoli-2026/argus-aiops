apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: mlflow
  {{- with .Values.mlflow.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: mlflow
spec:
  accessModes: ["ReadWriteOnce"]
  {{- /* Omitted when empty: an explicit "" means "no StorageClass" to Kubernetes,
         not "use the cluster default" — so the key has to disappear entirely. */}}
  {{- with .Values.mlflow.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mlflow.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate # single PVC, RWO
  selector:
    matchLabels: { app: mlflow }
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      serviceAccountName: mlflow
      containers:
        - name: mlflow
          image: {{ .Values.mlflow.image }}
          command: ["bash", "-c"]
          args:
            - |
              {{- with .Values.mlflow.extraPipPackages }}
              pip install --quiet {{ . }} &&
              {{- end }}
              mlflow server \
                --backend-store-uri sqlite:////data/mlflow.db \
                --serve-artifacts \
                --artifacts-destination {{ .Values.artifactUri | default "/data/mlartifacts" }} \
                --host 0.0.0.0 --port 5000 \
                --workers 2
          {{- with .Values.mlflow.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1200Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  selector: { app: mlflow }
  ports:
    - port: 5000
      targetPort: 5000
