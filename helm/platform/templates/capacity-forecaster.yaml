{{- if .Values.capacityForecaster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-forecaster
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: capacity-forecaster }
  template:
    metadata:
      labels: { app: capacity-forecaster }
    spec:
      containers:
        - name: forecaster
          image: {{ include "argus.image" (list . "argus-capacity-forecaster") }}
          env:
            - name: PROM_URL
              value: {{ .Values.prometheusUrl }}
            - name: THRESHOLD
              value: {{ .Values.capacityForecaster.threshold | quote }}
            - name: HORIZON_HOURS
              value: {{ .Values.capacityForecaster.horizonHours | quote }}
            - name: DISK_MOUNTPOINT
              value: {{ .Values.capacityForecaster.diskMountpoint | quote }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests: { cpu: 200m, memory: 600Mi }
            limits: { memory: 1200Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: capacity-forecaster
  namespace: aiops
  labels: { app: capacity-forecaster }
spec:
  selector: { app: capacity-forecaster }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capacity-forecaster
  namespace: aiops
spec:
  selector:
    matchLabels: { app: capacity-forecaster }
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      honorLabels: true
{{- end }}
