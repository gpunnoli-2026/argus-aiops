{{- if .Values.retraining.enabled }}
# Nightly retraining. Promotion is gated inside train_anomaly.py, so a bad night
# keeps the old production model. The one-shot equivalent is `make train`
# (ml/training/train-job.yaml), which borrows this CronJob's image.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retraining
  namespace: aiops
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argus-retrain-anomaly
  namespace: aiops
spec:
  schedule: {{ .Values.retraining.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: retraining
          containers:
            - name: train
              image: {{ include "argus.image" (list . "argus-trainer") }}
              env:
                - name: PROM_URL
                  value: {{ .Values.prometheusUrl }}
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow.mlflow:5000
                - name: TRAIN_HOURS
                  value: {{ .Values.retraining.trainHours | quote }}
                # Refresh only: never promote the first model on a new cluster.
                - name: REQUIRE_PRODUCTION_BASELINE
                  value: "true"
              resources:
                requests: { cpu: 250m, memory: 500Mi }
                limits: { memory: 1Gi }
{{- end }}
