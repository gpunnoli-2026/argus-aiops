{{- if .Values.anomalyDetector.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anomaly-detector
  namespace: aiops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detector
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: anomaly-detector }
  template:
    metadata:
      labels: { app: anomaly-detector }
    spec:
      serviceAccountName: anomaly-detector
      containers:
        - name: detector
          image: {{ include "argus.image" (list . "argus-anomaly-detector") }}
          env:
            - name: PROM_URL
              value: {{ .Values.prometheusUrl }}
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow:5000
            - name: MODEL_URI
              value: {{ .Values.anomalyDetector.modelUri }}
            - name: SCORE_INTERVAL_SECONDS
              value: {{ .Values.anomalyDetector.scoreIntervalSeconds | quote }}
            - name: MODEL_REFRESH_SECONDS
              value: {{ .Values.anomalyDetector.modelRefreshSeconds | quote }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests: { cpu: 100m, memory: 400Mi }
            limits: { memory: 800Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-detector
  namespace: aiops
  labels: { app: anomaly-detector }
spec:
  selector: { app: anomaly-detector }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: anomaly-detector
  namespace: aiops
spec:
  selector:
    matchLabels: { app: anomaly-detector }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # our metrics carry their own `service` label (the scored boutique service);
      # without honorLabels Prometheus renames it to exported_service
      honorLabels: true
{{- end }}
