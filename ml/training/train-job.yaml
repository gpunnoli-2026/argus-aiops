# One-shot training job. Run: make train
# TRAINER_IMAGE is filled in by `make train` with the image the deployed
# retrain CronJob uses, so a manual run trains with the version that is live.
apiVersion: batch/v1
kind: Job
metadata:
  name: argus-train-anomaly
  namespace: aiops
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: retraining
      containers:
        - name: train
          image: TRAINER_IMAGE
          env:
            - name: PROM_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring:9090
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow:5000
            - name: TRAIN_HOURS
              value: "6"
          resources:
            requests: { cpu: 250m, memory: 500Mi }
            limits: { memory: 1Gi }
