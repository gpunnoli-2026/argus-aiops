name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check services/ ml/ src/ tests/

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/anomaly-detector/requirements.txt \
                      -r services/alert-correlator/requirements.txt \
                      -r services/capacity-forecaster/requirements.txt \
                      -r services/diagnostic/requirements.txt \
                      pytest

      - name: Run unit tests
        run: pytest tests/ -q

  # Builds the runbook index in a real Postgres and scores retrieval against
  # the golden set; fails if hybrid retrieval drops below the committed baseline.
  rag:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: argus_rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d argus_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAG_MODEL_CACHE: ${{ github.workspace }}/.rag-model-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The evaluation folds its cases through the real correlator.
      - name: Install dependencies
        run: |
          pip install -r services/diagnostic/requirements.txt \
                      -r services/alert-correlator/requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .rag-model-cache
          key: rag-model-${{ hashFiles('services/diagnostic/embed.py') }}

      - name: Build the runbook index
        run: python services/diagnostic/ingest.py

      - name: Evaluate retrieval
        run: python services/diagnostic/eval/run_eval.py

  gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No cluster: this catches a root chart or kustomization that no longer
      # renders, which Argo CD would otherwise report only at sync time.
      - name: Render the Argo CD root app
        run: |
          for cloud in aws gcp kind; do
            helm template argus-root argocd/root --set cloud=$cloud > /dev/null
          done

      - name: Render the platform chart with each cloud overlay
        run: |
          for cloud in aws gcp kind; do
            helm template argus helm/platform --values helm/values/$cloud/platform.yaml \
              --set image.tag=${{ github.sha }} > /dev/null
          done

      - name: Build the kustomizations
        run: kubectl kustomize deploy/boutique > /dev/null

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [aws, gcp/0-bootstrap, gcp/1-org, gcp/2-networks, gcp/3-apps]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      # -backend=false: no credentials, no state — this only type-checks the
      # configuration, which is what breaks when the two roots drift apart.
      - name: Terraform validate (${{ matrix.root }})
        run: |
          terraform -chdir=terraform/${{ matrix.root }} init -backend=false -input=false
          terraform -chdir=terraform/${{ matrix.root }} validate
