name: Images

# Every pushed commit on every branch gets images tagged with its full git SHA,
# so a deploy can ask for exactly the code at the commit it is deploying.
# `latest` only ever moves on main.
on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke: what proves the image works, run as the container command.
          # Services import the app, as uvicorn will.
          - image: argus-anomaly-detector
            context: services
            service: anomaly-detector
            smoke: python -c "import main; print(main.app.title)"
          # The forecaster imports prophet lazily, so run one real fit: a ramp
          # from 30% to 60% over 6h must cross 80% about 4 hours out.
          - image: argus-capacity-forecaster
            context: services
            service: capacity-forecaster
            smoke: >-
              python -c "import main, numpy as np, pandas as pd;
              df = pd.DataFrame({'ds': pd.date_range('2026-01-01', periods=72, freq='300s'),
              'y': np.linspace(0.30, 0.60, 72)});
              h = main.hours_to_threshold(df); assert 3 < h < 5, h; print(h)"
          - image: argus-alert-correlator
            context: services
            service: alert-correlator
            smoke: python -c "import main; print(main.app.title)"
          # No production model to refresh: the skip path, no Prometheus needed.
          - image: argus-trainer
            context: ml/training
            smoke: python /app/train_anomaly.py
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local daemon first: a commit's tag is only published
      # once the image has started successfully.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test
        run: >-
          docker run --rm -e REQUIRE_PRODUCTION_BASELINE=true
          "$IMAGE:${{ github.sha }}" ${{ matrix.smoke }}

      - name: Push
        run: docker push --all-tags "$IMAGE"
